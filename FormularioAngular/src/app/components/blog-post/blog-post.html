<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4 shadow-sm">
        <h3 class="card-title mb-4">Nueva Publicación</h3>

        <form (ngSubmit)="onSubmit()">

          <div class="mb-3">
            <label for="title" class="form-label">Título</label>
            <input id="title" type="text" class="form-control" [formControl]="title">
          </div>

          <div class="mb-3">
            <label for="description" class="form-label">Descripción</label>
            <textarea id="description" class="form-control" rows="3" [formControl]="description"></textarea>
          </div>

          <div class="mb-3">
            <label for="category" class="form-label">Categoría</label>
            <select id="category" class="form-select" [formControl]="category">
              <option value="">Selecciona una opción...</option>
              @for (cat of categories; track cat) {
                <option [value]="cat">{{ cat }}</option>
              }
            </select>
          </div>

          <div class="mb-3">
            <label for="tags" class="form-label">Etiquetas</label>
            <input id="tags" type="text" class="form-control" [formControl]="tags" placeholder="ej. angular, typescript">
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email del autor</label>
            <input id="email" type="email" class="form-control" [formControl]="email">
          </div>

          <div class="form-check mb-3">
            <input id="publishNow" type="checkbox" class="form-check-input" [formControl]="publishNow">
            <label for="publishNow" class="form-check-label">Publicar ahora</label>
          </div>

          @if (!publishNow.value) {
            <div class="mb-3">
              <label for="publishDate" class="form-label">Fecha de publicación</label>
              <input id="publishDate" type="date" class="form-control" [formControl]="publishDate">
            </div>
          }

          <button type="submit" class="btn btn-primary w-100">Guardar</button>

        </form>
      </div>
    </div>
  </div>
</div>
