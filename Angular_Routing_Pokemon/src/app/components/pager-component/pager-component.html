<nav aria-label="Paginación" class="d-flex justify-content-center align-items-center gap-3 mt-4">
  <button class="btn btn-outline-danger" (click)="go(1)" [disabled]="page() === 1" title="Primera">
    <i class="bi bi-chevron-bar-left"></i>
  </button>
  <button class="btn btn-outline-danger" (click)="go(page() - 1)" [disabled]="page() === 1">
    <i class="bi bi-chevron-left"></i> Anterior
  </button>
  <span class="text-body-secondary">Página <strong>{{ page() }}</strong> de {{ pages() }}</span>
  <button class="btn btn-outline-danger" (click)="go(page() + 1)" [disabled]="page() === pages()">
    Siguiente <i class="bi bi-chevron-right"></i>
  </button>
  <button class="btn btn-outline-danger" (click)="go(pages())" [disabled]="page() === pages()" title="Última">
    <i class="bi bi-chevron-bar-right"></i>
  </button>
</nav>
