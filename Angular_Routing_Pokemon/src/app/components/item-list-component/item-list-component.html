<div class="container">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h2 class="mb-0"><i class="bi bi-bag-fill text-danger"></i> Objetos</h2>
    @if (!loading() && !error()) {
      <span class="badge text-bg-secondary">{{ count() }} en total</span>
    }
  </div>

  @if (loading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-danger" role="status"><span class="visually-hidden">Cargando…</span></div>
    </div>
  } @else if (error()) {
    <div class="alert alert-danger d-flex justify-content-between align-items-center">
      No se pudo cargar el listado.
      <button class="btn btn-sm btn-danger" (click)="load(offset())">Reintentar</button>
    </div>
  } @else {
    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3">
      @for (el of list(); track el.id) {
        <div class="col">
          <app-item-item-component [item]="el"></app-item-item-component>
        </div>
      }
    </div>
    <app-pager-component [offset]="offset()" [limit]="limit" [count]="count()" (pageChange)="load($event)"></app-pager-component>
  }
</div>
