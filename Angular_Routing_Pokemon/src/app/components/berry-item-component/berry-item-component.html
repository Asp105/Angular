<a [routerLink]="['/berry-detail', berry().id]" class="poke-card-link">
  <div class="card poke-card h-100 shadow-sm text-center border-0">
    <img [src]="berry().sprite" [alt]="berry().name" loading="lazy" class="card-img-top p-3 mx-auto">
    <div class="card-body pt-0">
      <small class="text-body-secondary">#{{ berry().id }}</small>
      <h6 class="card-title text-capitalize mb-0">{{ berry().name.replaceAll('-', ' ') }}</h6>
    </div>
  </div>
</a>
