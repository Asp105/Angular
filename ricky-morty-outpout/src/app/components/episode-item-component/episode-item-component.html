<article class="card episode-card h-100">
    <div class="card-body d-flex flex-column">
        <span class="badge episode-code align-self-start">{{ episode()?.episode }}</span>
        <h2 class="card-title episode-title mt-3">{{ episode()?.name }}</h2>
        <p class="episode-date mb-4">{{ episode()?.air_date }}</p>
        <button type="button" class="btn btn-dark mt-auto" (click)="emitEpisodeClicked()">
            View details <span aria-hidden="true">&rarr;</span>
        </button>
    </div>
</article>
