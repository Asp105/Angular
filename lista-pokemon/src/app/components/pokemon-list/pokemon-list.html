<div class="container my-4">
  <h2 class="text-center mb-4">Lista de Pokémon</h2>
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
    @for (p of pokemonList; track p.id) {
      <div class="col">
        <app-pokemon-item [pokemon]="p"></app-pokemon-item>
      </div>
    }
  </div>
</div>
